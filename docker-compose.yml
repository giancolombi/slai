services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: slai
      POSTGRES_PASSWORD: slai
      POSTGRES_DB: slai
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slai"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
