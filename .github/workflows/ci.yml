name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: slai, POSTGRES_PASSWORD: slai, POSTGRES_DB: slai }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U slai" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://slai:slai@localhost:5433/slai
      DATABASE_APP_URL: postgres://slai_app:slai_app@localhost:5433/slai
      DATABASE_SYSTEM_URL: postgres://slai_worker:slai_worker@localhost:5433/slai
      APP_URL: http://localhost:5173
      API_URL: http://localhost:8787
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: .data/uploads
      MODEL_PROVIDER: mock
      AGENT_RUNTIME: local
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate secrets
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
