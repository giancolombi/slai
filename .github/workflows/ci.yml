name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: slai, POSTGRES_PASSWORD: slai, POSTGRES_DB: slai }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U slai" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://slai:slai@localhost:5433/slai
      DATABASE_APP_URL: postgres://slai_app:slai_app@localhost:5433/slai
      DATABASE_SYSTEM_URL: postgres://slai_worker:slai_worker@localhost:5433/slai
      DATABASE_AUTH_URL: postgres://slai_auth:slai_auth@localhost:5433/slai
      APP_URL: http://localhost:5173
      API_URL: http://localhost:8787
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: .data/uploads
      MODEL_PROVIDER: mock
      AGENT_RUNTIME: local
      # The s3 driver tests must run in CI (they skip locally without MinIO).
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # S3-compatible storage for the s3 driver tests (a service container can't pass `server /data`).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=slai-minio -e MINIO_ROOT_PASSWORD=slai-minio-secret \
            -e MINIO_KMS_SECRET_KEY=slai-kms:c2xhaS1zdGFnaW5nLWttcy1rZXktMzItYnl0ZXMhISE= \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Generate secrets
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
